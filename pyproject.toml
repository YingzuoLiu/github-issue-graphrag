[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-issue-graphrag"
version = "0.3.0"
description = "A lightweight GraphRAG pipeline for analyzing GitHub issues and repository documents."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Yingzuo Liu" }
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "networkx>=3.2",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "tqdm>=4.66"
]

[project.urls]
Homepage = "https://github.com/YingzuoLiu/github-issue-graphrag"
Repository = "https://github.com/YingzuoLiu/github-issue-graphrag"

[project.optional-dependencies]
app = [
  "streamlit>=1.32"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.8",
  "qdrant-client>=1.14,<2",
  "streamlit>=1.32"
]
embeddings = [
  "sentence-transformers>=2.7"
]
vector = [
  "qdrant-client>=1.14,<2"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned explicitly. The dev extra tracks an unpinned ruff, and relying on the
# linter's implicit defaults means CI quietly changes meaning whenever ruff
# expands its default rule set.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
